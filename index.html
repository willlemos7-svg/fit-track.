<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#182d35"><title>FIT TRACK</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;color:#20313a;background:#edf2f2}*{box-sizing:border-box}body{margin:0}header{background:#182d35;color:white;padding:28px 18px 20px}h1{margin:0;font-size:27px;letter-spacing:1px}header p{margin:5px 0 0;color:#b6d0cf}main{max-width:650px;margin:auto;padding:16px}.tabs,.days{display:flex;gap:7px;margin-bottom:15px}.tabs button,.days button{flex:1}button{border:0;border-radius:11px;padding:12px 9px;background:#dbe6e5;color:#263b41;font-weight:650}button.active,.primary{background:#217c75;color:white}.card{background:white;border-radius:16px;padding:16px;margin-bottom:13px;box-shadow:0 2px 8px #18343a0a}h2{font-size:19px;margin:0 0 12px}h3{font-size:15px;margin:0 0 8px}.muted{color:#65797c;font-size:13px}.exercise{border:1px solid #dce6e5;border-radius:12px;padding:12px;margin:8px 0;cursor:pointer}.exercise.selected{border-color:#217c75;background:#f0faf8}.line{display:flex;align-items:center;justify-content:space-between;gap:9px}.line>div{flex:1}.series{display:grid;grid-template-columns:38px 1fr 1fr 48px;gap:7px;align-items:center;margin:9px 0}input,select{width:100%;padding:11px 7px;border:1px solid #cddad9;border-radius:9px;font-size:16px;background:#fff}input[type=checkbox]{width:23px;height:23px;accent-color:#217c75}.small{font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}.hidden{display:none}.bar{height:8px;background:#dce7e5;border-radius:8px;overflow:hidden;margin:10px 0}.fill{height:100%;background:#217c75;width:0}canvas{width:100%;height:210px}a{color:#217c75}.history{padding:9px 0;border-bottom:1px solid #edf1f1}footer{text-align:center;color:#72878a;font-size:12px;padding:20px}</style></head><body><header><h1>FIT TRACK</h1><p>Meu treino e evolução 💪</p></header><main><div class="tabs"><button class="active" data-tab="treino">Treino</button><button data-tab="cardio">Cardio</button><button data-tab="evolucao">Evolução</button></div><section id="treino"><div class="days" id="days"></div><div class="card"><h2 id="workoutTitle"></h2><div class="muted" id="progressLabel"></div><div class="bar"><div class="fill" id="progressFill"></div></div><div id="exerciseList"></div></div><div class="card" id="seriesCard"></div><button class="primary" style="width:100%" id="finish">Finalizar e registrar treino</button></section><section id="cardio" class="hidden"><div class="card"><h2>Registrar cardio</h2><label>Modalidade<select id="cardioType"><option>Escada</option><option>Bicicleta</option><option>Esteira</option><option>Caminhada</option><option>Outro</option></select></label><p><label>Tempo (minutos)<input id="cardioMinutes" type="number" min="1" value="30"></label></p><button class="primary" id="saveCardio">Salvar cardio</button></div></section><section id="evolucao" class="hidden"><div class="card"><h2>Resumo</h2><div id="stats"></div></div><div class="card"><h2>Peso corporal</h2><div class="line"><input type="number" inputmode="decimal" step="0.1" id="bodyWeight" placeholder="Peso em kg"><button class="primary" id="saveWeight">Salvar</button></div><canvas id="weightChart" width="600" height="220"></canvas></div><div class="card"><h2>Histórico de treinos</h2><div id="history"></div></div><div class="card"><h2>Backup dos seus dados</h2><p class="muted">Exporte regularmente um arquivo de segurança para o app Arquivos ou iCloud Drive. O armazenamento local pode ser apagado pelo iOS.</p><div class="actions"><button id="export">Exportar backup</button><button id="importBtn">Importar backup</button></div><input type="file" id="importFile" accept="application/json,.json" class="hidden"></div></section><footer>FIT TRACK · versão local 1.0</footer></main><script>
const plans=[{day:'Seg',name:'A · Peito / Ombros / Tríceps',ex:[['Supino inclinado',3,'10–12'],['Supino reto máquina',2,'10–12'],['Desenvolvimento ombro máquina',2,'12–15'],['Elevação lateral',3,'12–15'],['Tríceps cross barra reta',3,'12–15']]},{day:'Ter',name:'B · Costas / Bíceps',ex:[['Puxador fechado',3,'10–12'],['Remada baixa triângulo',3,'10–12'],['Remada máquina aberta',3,'10–12'],['Elevação Y',3,'10–12'],['Rosca martelo corda',2,'10–12'],['Rosca bíceps duplo cross',2,'10–15']]},{day:'Qua',name:'C · Pernas',ex:[['Leg press 45°',3,'10–12'],['Stiff barra máquina',2,'10–12'],['Cadeira extensora',3,'12–15'],['Mesa flexora',2,'10–12'],['Panturrilha',3,'10–12']]},{day:'Sex',name:'D · Upper',ex:[['Supino inclinado',2,'10–12'],['Desenvolvimento ombro máquina',2,'10–12'],['Elevação lateral',3,'12–15'],['Remada baixa barra romana',2,'10–12'],['Voador peito',2,'10–12'],['Tríceps testa',2,'10–12']]}];
let data;try{data=JSON.parse(localStorage.getItem('fitTrackData')||'{}')}catch(e){data={}};data.sessions??=[];data.cardio??=[];data.weights??=[];data.drafts??={};let day=0,exercise=0;function save(){try{localStorage.setItem('fitTrackData',JSON.stringify(data))}catch(e){alert('Armazenamento indisponível neste modo de abertura. Exporte seus dados e use um navegador compatível.')}}function draftKey(){return 'day'+day}function draft(){return data.drafts[draftKey()]??={}}function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const p=plans[day],d=draft();document.getElementById('days').innerHTML=plans.map((p,i)=>`<button class="${i===day?'active':''}" data-day="${i}">${p.day}</button>`).join('');document.getElementById('workoutTitle').textContent=p.name;const total=p.ex.reduce((s,e)=>s+e[1],0);const done=Object.values(d).filter(x=>x.done).length;document.getElementById('progressLabel').textContent=`${p.ex.length} exercícios · ${done}/${total} séries concluídas`;document.getElementById('progressFill').style.width=(100*done/total)+'%';document.getElementById('exerciseList').innerHTML=p.ex.map((e,i)=>`<div class="exercise ${exercise===i?'selected':''}" data-ex="${i}"><div class="line"><div><strong>${esc(e[0])}</strong><div class="muted">${e[1]} séries × ${e[2]} repetições</div></div><span>${Array.from({length:e[1]},(_,j)=>d[i+'-'+j]?.done).every(Boolean)?'✅':'›'}</span></div></div>`).join('');const e=p.ex[exercise];document.getElementById('seriesCard').innerHTML=`<h2>${esc(e[0])}</h2><p class="muted">Carga e repetições por série</p><div class="series small"><b>Série</b><b>Carga (kg)</b><b>Reps.</b><b>Feita</b></div>${Array.from({length:e[1]},(_,j)=>{const v=d[exercise+'-'+j]||{};return `<div class="series"><span>${j+1}ª</span><input type="number" inputmode="decimal" step="0.5" data-series="${j}" data-field="kg" placeholder="kg" value="${esc(v.kg??'')}"><input type="number" inputmode="numeric" data-series="${j}" data-field="reps" placeholder="${e[2]}" value="${esc(v.reps??'')}"><input type="checkbox" data-series="${j}" data-field="done" ${v.done?'checked':''}></div>`}).join('')}<button style="width:100%" id="video">▶ Ver execução no YouTube</button>`;document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{day=+b.dataset.day;exercise=0;render()});document.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>{exercise=+b.dataset.ex;render()});document.querySelectorAll('[data-field]').forEach(el=>el.onchange=()=>{const key=exercise+'-'+el.dataset.series;d[key]??={};d[key][el.dataset.field]=el.type==='checkbox'?el.checked:el.value;save();render()});document.getElementById('video').onclick=()=>window.open('https://www.youtube.com/results?search_query='+encodeURIComponent(e[0]+' execução correta musculação'),'_blank')}
function showTab(tab){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));['treino','cardio','evolucao'].forEach(id=>document.getElementById(id).classList.toggle('hidden',id!==tab));if(tab==='evolucao')renderEvolution()}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));document.getElementById('finish').onclick=()=>{const p=plans[day],d=draft();const total=p.ex.reduce((s,e)=>s+e[1],0),completed=Object.values(d).filter(x=>x.done).length;if(!completed&&!confirm('Nenhuma série marcada como concluída. Registrar mesmo assim?'))return;data.sessions.push({date:new Date().toISOString(),name:p.name,completed,total,sets:JSON.parse(JSON.stringify(d))});delete data.drafts[draftKey()];save();render();alert('Treino registrado! 💪')};document.getElementById('saveCardio').onclick=()=>{const minutes=+document.getElementById('cardioMinutes').value;if(!(minutes>0))return alert('Informe o tempo de cardio.');data.cardio.push({date:new Date().toISOString(),type:document.getElementById('cardioType').value,minutes});save();alert('Cardio salvo!')};document.getElementById('saveWeight').onclick=()=>{const kg=+document.getElementById('bodyWeight').value;if(!(kg>0))return alert('Informe o peso.');data.weights.push({date:new Date().toISOString(),kg});save();renderEvolution();document.getElementById('bodyWeight').value=''};function renderEvolution(){document.getElementById('stats').textContent=`${data.sessions.length} treinos registrados · ${data.cardio.reduce((s,c)=>s+c.minutes,0)} minutos de cardio`;document.getElementById('history').innerHTML=data.sessions.length?data.sessions.slice().reverse().map(s=>`<div class="history"><strong>${esc(s.name)}</strong><div class="muted">${new Date(s.date).toLocaleDateString('pt-BR')} · ${s.completed}/${s.total} séries</div></div>`).join(''):'Nenhum treino registrado ainda.';const canvas=document.getElementById('weightChart'),ctx=canvas.getContext('2d');ctx.clearRect(0,0,600,220);ctx.fillStyle='#65797c';ctx.font='17px sans-serif';if(!data.weights.length){ctx.fillText('Registre seu peso para ver o gráfico.',15,110);return}const a=data.weights.slice(-30),min=Math.min(...a.map(x=>x.kg))-1,max=Math.max(...a.map(x=>x.kg))+1;ctx.strokeStyle='#217c75';ctx.lineWidth=3;ctx.beginPath();a.forEach((x,i)=>{const px=30+(a.length===1?0:i/(a.length-1)*535),py=190-(x.kg-min)/(max-min)*150;i?ctx.lineTo(px,py):ctx.moveTo(px,py)});ctx.stroke();ctx.fillText(max.toFixed(1)+' kg',8,25);ctx.fillText(min.toFixed(1)+' kg',8,212)}document.getElementById('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fit-track-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();document.getElementById('importFile').onchange=async e=>{try{const raw=JSON.parse(await e.target.files[0].text());const v=raw.data;if(!v||!Array.isArray(v.sessions)||!Array.isArray(v.cardio)||!Array.isArray(v.weights))throw Error('Formato inválido');if(confirm('Substituir os registros atuais pelo backup selecionado?')){data=v;data.drafts??={};save();render();renderEvolution();alert('Backup importado!')}}catch(err){alert('Não foi possível importar: '+err.message)}};render();
</script></body></html>
